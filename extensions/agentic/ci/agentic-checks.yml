# Installed by `speckit.agentic.init`. Make `agentic-checks` a required status check on the default branch.
name: agentic-checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
jobs:
  agentic-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # pin to a commit SHA in your repository
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5   # pin to a commit SHA in your repository
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.2
      - name: Self-test (every check fails on its broken fixture)
        run: python .specify/extensions/agentic/scripts/agentic.py selftest
      - name: Checks on a pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .specify/extensions/agentic/scripts/agentic.py check --base-ref "origin/${{ github.base_ref }}"
      - name: Checks and drift on the default branch
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" > "$RUNNER_TEMP/changed.txt"
          python .specify/extensions/agentic/scripts/agentic.py check --changed-files "$RUNNER_TEMP/changed.txt"
