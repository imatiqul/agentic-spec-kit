# agentic-connect: notifications, review mirroring and intake.  Copy to .github/workflows/agentic-connect.yml
#
# Why this is a separate workflow from agentic-checks:
#   A workflow that runs on `pull_request` takes its own file, and the kit's code, from the pull request. Anyone who can
#   open one could change either and read a secret. So the checks run there with no secret at all, and everything that
#   needs a secret runs here, from the default branch's copy of this file and of the kit:
#     - `workflow_run` fires after agentic-checks finishes. The pull request's files are checked out as DATA under head/
#       and read by the kit under trusted/. Nothing from head/ is executed.
#     - `schedule` runs on the default branch.
#     - `workflow_dispatch` runs on the branch the person who starts it chooses. The intake job therefore has a
#       condition of its own: it runs on the default branch and nowhere else.
#   CK-PIPELINE-SECRETS fails a workflow that runs on a pull request and uses one of these secrets.
#
# What this file cannot do:
#   Whoever may push a branch may change this file on that branch, take the condition out and start the workflow there.
#   On GitHub a person with write access can read every secret of the repository; the condition guards against a
#   slip, not against that person. A secret that must not be readable from a branch belongs in an environment that
#   only the default branch may use (Settings, Environments, "Deployment branches and tags"), named by the job with
#   `environment:`.
#
# Pull requests from forks:
#   The notify and mirror jobs skip a run that came from a fork. actions/checkout refuses to check out a fork's commit
#   in a `workflow_run` job unless `allow-unsafe-pr-checkout: true` is set on the step. To notify for forks, read
#   https://gh.io/securely-using-pull_request_target first, then set that input on the `head` checkout of the notify
#   job and take the last part of its condition out. Leave the mirror job as it is: it pushes to this repository.
#
# Pull requests that a bot opened (seen on GitHub on 2026-11-27):
#   GitHub starts no `workflow_run` after a run of agentic-checks whose actor is the workflow's own bot, whether a person
#   approved that run or not. So notify and mirror do not run for a pull request that agentic-open-pull-request opened.
#
# Mirroring reviews into decision records: the repository variable AGENTIC_MIRROR chooses the way (BWR-6, BWR-7).
#   unset          no job mirrors. A person records with `agentic.py record --change pull/<n>`.
#   true           the job `mirror` pushes the records onto the reviewed pull request. Where the default branch
#                  dismisses an approval when a commit is pushed, that push dismisses the review the records cite: each
#                  reviewer then approves again with the same line, and the checks accept that approval in its place.
#   after-merge    the job `mirror-after-merge` runs after the checks of the push that a merge makes, mirrors the reviews
#                  of the merged pull request, and opens a pull request with the records, on a branch of its own. Until
#                  that one is merged the gate shows as open. The workflow's own bot opens it, so GitHub holds its checks
#                  until a person approves them, and this workflow does not run for it.
#   Where approvals are dismissed on a push, choose `after-merge`, or `true` with a second approval: the dismissed
#   review is not counted either way, and `record --change` after the merge, on a branch of its own, does it by hand.
name: agentic-connect
on:
  workflow_run:
    workflows: [agentic-checks]
    types: [completed]
  schedule:
    - cron: "17 6 * * 1-5"      # weekday mornings (UTC): fetch new and changed requirements
  workflow_dispatch:
permissions:
  contents: read
jobs:
  notify:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      BASE: ${{ github.event.repository.default_branch }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
      REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      # Name here only the secrets your connect.yml names. Delete the lines you do not use.
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      JIRA_USER: ${{ secrets.JIRA_USER }}
      JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
      ADO_TOKEN: ${{ secrets.ADO_TOKEN }}
      CLICKUP_TOKEN: ${{ secrets.CLICKUP_TOKEN }}
      TRACKER_GITHUB_TOKEN: ${{ secrets.TRACKER_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          path: trusted            # the default branch: the only code that runs in this job
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: head               # the change under review: read, never run
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: .agentic-state
          key: agentic-sent-${{ github.run_id }}
          restore-keys: agentic-sent-
      - name: Tell people what changed
        run: |
          url=""
          if [ -n "$PR_NUMBER" ]; then url="$REPO_URL/pull/$PR_NUMBER"; fi
          python trusted/.specify/extensions/agentic/scripts/agentic.py --root head connect notify \
            --base-ref "origin/$BASE" --commit "$HEAD_SHA" --pr-url "$url" \
            --ledger .agentic-state/sent.txt --summary "$GITHUB_STEP_SUMMARY"

  # Optional. Turns reviews that carry a gate's approval line into decision records and commits them to the pull request.
  # Enable it by setting the repository variable AGENTIC_MIRROR to "true".
  # The commit is pushed with KIT_PUSH_TOKEN. Use a GitHub App token: a push made with the built-in token does not start
  # workflows, so the checks would not run on the new commit. List KIT_PUSH_TOKEN under `pipeline_secrets` in connect.yml.
  mirror:
    if: >-
      github.event_name == 'workflow_run' && vars.AGENTIC_MIRROR == 'true' && github.event.workflow_run.pull_requests[0].number
      && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      BASE: ${{ github.event.repository.default_branch }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          path: trusted
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: head
          fetch-depth: 0
          token: ${{ secrets.KIT_PUSH_TOKEN }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.2
      - name: Mirror reviews into decision records
        run: |
          python trusted/.specify/extensions/agentic/scripts/agentic.py --root head connect mirror \
            --base-ref "origin/$BASE" --change "pull/$PR_NUMBER" --commit "$HEAD_SHA" --write
          cd head
          if [ -z "$(git status --porcelain .specify/agentic/decisions .specify/agentic/audit)" ]; then echo "nothing to record"; exit 0; fi
          git config user.name "agentic-spec-kit"
          git config user.email "agentic-spec-kit@users.noreply.github.com"
          git add .specify/agentic/decisions .specify/agentic/audit
          git commit -m "Record gate decisions mirrored from pull-request reviews"
          git push origin "HEAD:refs/heads/$HEAD_BRANCH"

  mirror-after-merge:
    # After the merge (BWR-6): the push to the default branch that a person's merge makes. The kit runs from that
    # commit of the default branch, which is merged and so trusted, and finds the merged pull request from it.
    if: >-
      github.event_name == 'workflow_run' && vars.AGENTIC_MIRROR == 'after-merge'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == github.event.repository.default_branch
      && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      BASE: ${{ github.event.repository.default_branch }}
      MERGED: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.2
      - name: Mirror the reviews of the merged pull request, on a branch of their own
        run: |
          python .specify/extensions/agentic/scripts/agentic.py connect mirror --merged "$MERGED" --base-ref "origin/$BASE" --write
          if [ -z "$(git status --porcelain .specify/agentic/decisions .specify/agentic/audit)" ]; then echo "nothing to record"; exit 0; fi
          RECORDS="agentic/records-${MERGED:0:12}"
          git config user.name "agentic-spec-kit"
          git config user.email "agentic-spec-kit@users.noreply.github.com"
          git switch -c "$RECORDS"
          git add .specify/agentic/decisions .specify/agentic/audit
          git commit -m "Record gate decisions mirrored after the merge of ${MERGED:0:12}"
          git push origin "HEAD:refs/heads/$RECORDS"
          gh pr create --base "$BASE" --head "$RECORDS" \
            --title "Gate decisions mirrored after the merge of ${MERGED:0:12}" \
            --body "Decision records mirrored by agentic-spec-kit from the reviews of the pull request merged as ${MERGED}. They approve nothing: the reviews do, and the checks read them again. Approve the run of the checks, then merge with a merge commit."

  intake:
    # A schedule runs on the default branch and nowhere else. A person chooses the branch: on any other, the job is skipped.
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      BASE: ${{ github.ref_name }}      # the default branch: this job runs nowhere else
      JIRA_USER: ${{ secrets.JIRA_USER }}
      JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
      ADO_TOKEN: ${{ secrets.ADO_TOKEN }}
      CLICKUP_TOKEN: ${{ secrets.CLICKUP_TOKEN }}
      TRACKER_GITHUB_TOKEN: ${{ secrets.TRACKER_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.2
      - name: Fetch requirements from the configured sources
        run: python .specify/extensions/agentic/scripts/agentic.py connect fetch
      - name: Open a pull request with what arrived
        run: |
          if [ -z "$(git status --porcelain .specify/agentic/intake)" ]; then echo "nothing new"; exit 0; fi
          branch="intake/$(date -u +%Y%m%d-%H%M)"
          git config user.name "agentic-spec-kit"
          git config user.email "agentic-spec-kit@users.noreply.github.com"
          git checkout -b "$branch"
          git add .specify/agentic/intake
          git commit -m "Intake: requirements fetched from trackers"
          git push origin "$branch"
          gh pr create --base "$BASE" --head "$branch" --title "Intake: new and changed requirements" \
            --body "Fetched by agentic-spec-kit. A Product Owner triages each record; nothing here is approved by being merged."
