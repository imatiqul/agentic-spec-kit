schema_version: "1.0"
workflow:
  id: "agentic-sdd"
  name: "Agentic SDD with human gates"
  version: "0.1.0"
  author: "Atiqul Islam"
  description: "specify → clarify → plan → tasks → implement → converge, pausing at gates G1–G7 until a human approves through the enforcement channel"

requires:
  speckit_version: ">=1.4.3"

inputs:
  spec:
    type: string
    required: true
    prompt: "Describe what you want to build"
  spec_id:
    type: string
    default: ""
    prompt: "Spec folder under specs/ (leave empty to use the most recently changed one)"
  integration:
    type: string
    default: "auto"

steps:
  - id: specify
    command: speckit.specify
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"
  - id: g1-spec
    type: agentic-gate
    gate: G1
    spec: "{{ inputs.spec_id }}"

  - id: clarify
    command: speckit.clarify
    integration: "{{ inputs.integration }}"
  - id: g2-clarify
    type: agentic-gate
    gate: G2
    spec: "{{ inputs.spec_id }}"

  - id: plan
    command: speckit.plan
    integration: "{{ inputs.integration }}"
  - id: g3-plan
    type: agentic-gate
    gate: G3
    spec: "{{ inputs.spec_id }}"

  - id: tasks
    command: speckit.tasks
    integration: "{{ inputs.integration }}"
  - id: analyze
    command: speckit.analyze
    integration: "{{ inputs.integration }}"
  - id: trace
    command: speckit.agentic.trace
    integration: "{{ inputs.integration }}"
  - id: g4-tasks
    type: agentic-gate
    gate: G4
    spec: "{{ inputs.spec_id }}"

  - id: implement
    command: speckit.implement
    integration: "{{ inputs.integration }}"
  - id: check
    command: speckit.agentic.check
    integration: "{{ inputs.integration }}"
  - id: g5-implementation
    type: agentic-gate
    gate: G5
    spec: "{{ inputs.spec_id }}"

  - id: converge
    command: speckit.converge
    integration: "{{ inputs.integration }}"
  - id: verify
    command: speckit.agentic.verify
    integration: "{{ inputs.integration }}"
  - id: g6-verification
    type: agentic-gate
    gate: G6
    spec: "{{ inputs.spec_id }}"

  - id: g7-release
    type: agentic-gate
    gate: G7
    spec: "{{ inputs.spec_id }}"
