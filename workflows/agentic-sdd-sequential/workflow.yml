schema_version: "1.0"
workflow:
  id: "agentic-sdd-sequential"
  name: "Agentic SDD, one agent playing each role in turn"
  version: "0.3.0"
  author: "Atiqul Islam"
  description: "The same stages and gates as the team workflow, for any coding agent: one role per step, each step a new session, at most two rework rounds"

requires:
  speckit_version: ">=1.4.3"

inputs:
  spec:
    type: string
    required: true
    prompt: "Describe what you want to build"
  spec_id:
    type: string
    required: true
    prompt: "Spec folder under specs/"
  integration:
    type: string
    default: "auto"

steps:
  - id: spec-spec-author
    command: speckit.agentic-team.role
    integration: "{{ inputs.integration }}"
    input:
      args: "agent=spec-author stage=spec spec={{ inputs.spec_id }} request={{ inputs.spec }}"
  - id: spec-independent-verifier
    command: speckit.agentic-team.role
    integration: "{{ inputs.integration }}"
    input:
      args: "agent=independent-verifier stage=spec spec={{ inputs.spec_id }}"
  - id: g1-spec
    type: agentic-gate
    gate: G1
    spec: "{{ inputs.spec_id }}"

  - id: clarify-spec-author
    command: speckit.agentic-team.role
    integration: "{{ inputs.integration }}"
    input:
      args: "agent=spec-author stage=clarify spec={{ inputs.spec_id }}"
  - id: g2-clarify
    type: agentic-gate
    gate: G2
    spec: "{{ inputs.spec_id }}"

  - id: plan-architect
    command: speckit.agentic-team.role
    integration: "{{ inputs.integration }}"
    input:
      args: "agent=architect stage=plan spec={{ inputs.spec_id }}"
  - id: plan-impact-analyst
    command: speckit.agentic-team.role
    integration: "{{ inputs.integration }}"
    input:
      args: "agent=impact-analyst stage=plan spec={{ inputs.spec_id }}"
  - id: plan-data-agent
    command: speckit.agentic-team.role
    integration: "{{ inputs.integration }}"
    input:
      args: "agent=data-agent stage=plan spec={{ inputs.spec_id }}"
  - id: plan-contract-agent
    command: speckit.agentic-team.role
    integration: "{{ inputs.integration }}"
    input:
      args: "agent=contract-agent stage=plan spec={{ inputs.spec_id }}"
  - id: plan-security-reviewer
    command: speckit.agentic-team.role
    integration: "{{ inputs.integration }}"
    input:
      args: "agent=security-reviewer stage=plan spec={{ inputs.spec_id }}"
  - id: plan-independent-verifier
    command: speckit.agentic-team.role
    integration: "{{ inputs.integration }}"
    input:
      args: "agent=independent-verifier stage=plan spec={{ inputs.spec_id }}"
  - id: g3-plan
    type: agentic-gate
    gate: G3
    spec: "{{ inputs.spec_id }}"

  - id: tasks-architect
    command: speckit.agentic-team.role
    integration: "{{ inputs.integration }}"
    input:
      args: "agent=architect stage=tasks spec={{ inputs.spec_id }}"
  - id: tasks-independent-verifier
    command: speckit.agentic-team.role
    integration: "{{ inputs.integration }}"
    input:
      args: "agent=independent-verifier stage=tasks spec={{ inputs.spec_id }}"
  - id: g4-tasks
    type: agentic-gate
    gate: G4
    spec: "{{ inputs.spec_id }}"

  - id: implement-orchestrator
    command: speckit.agentic-team.role
    integration: "{{ inputs.integration }}"
    input:
      args: "agent=orchestrator stage=implement spec={{ inputs.spec_id }}"
  - id: implement-test-agent
    command: speckit.agentic-team.role
    integration: "{{ inputs.integration }}"
    input:
      args: "agent=test-agent stage=implement spec={{ inputs.spec_id }}"
  - id: implement-data-agent
    command: speckit.agentic-team.role
    integration: "{{ inputs.integration }}"
    input:
      args: "agent=data-agent stage=implement spec={{ inputs.spec_id }}"
  - id: implement-contract-agent
    command: speckit.agentic-team.role
    integration: "{{ inputs.integration }}"
    input:
      args: "agent=contract-agent stage=implement spec={{ inputs.spec_id }}"
  - id: implement-backend-implementer
    command: speckit.agentic-team.role
    integration: "{{ inputs.integration }}"
    input:
      args: "agent=backend-implementer stage=implement spec={{ inputs.spec_id }}"
  - id: implement-frontend-implementer
    command: speckit.agentic-team.role
    integration: "{{ inputs.integration }}"
    input:
      args: "agent=frontend-implementer stage=implement spec={{ inputs.spec_id }}"
  - id: implement-ai-implementer
    command: speckit.agentic-team.role
    integration: "{{ inputs.integration }}"
    input:
      args: "agent=ai-implementer stage=implement spec={{ inputs.spec_id }}"
  - id: implement-security-reviewer
    command: speckit.agentic-team.role
    integration: "{{ inputs.integration }}"
    input:
      args: "agent=security-reviewer stage=implement spec={{ inputs.spec_id }}"
  - id: implement-independent-verifier
    command: speckit.agentic-team.role
    integration: "{{ inputs.integration }}"
    input:
      args: "agent=independent-verifier stage=implement spec={{ inputs.spec_id }}"
  - id: rework-1-data-agent
    command: speckit.agentic-team.role
    integration: "{{ inputs.integration }}"
    input:
      args: "agent=data-agent stage=implement spec={{ inputs.spec_id }}"
  - id: rework-1-contract-agent
    command: speckit.agentic-team.role
    integration: "{{ inputs.integration }}"
    input:
      args: "agent=contract-agent stage=implement spec={{ inputs.spec_id }}"
  - id: rework-1-backend-implementer
    command: speckit.agentic-team.role
    integration: "{{ inputs.integration }}"
    input:
      args: "agent=backend-implementer stage=implement spec={{ inputs.spec_id }}"
  - id: rework-1-frontend-implementer
    command: speckit.agentic-team.role
    integration: "{{ inputs.integration }}"
    input:
      args: "agent=frontend-implementer stage=implement spec={{ inputs.spec_id }}"
  - id: rework-1-ai-implementer
    command: speckit.agentic-team.role
    integration: "{{ inputs.integration }}"
    input:
      args: "agent=ai-implementer stage=implement spec={{ inputs.spec_id }}"
  - id: rework-1-security-reviewer
    command: speckit.agentic-team.role
    integration: "{{ inputs.integration }}"
    input:
      args: "agent=security-reviewer stage=implement spec={{ inputs.spec_id }}"
  - id: rework-1-independent-verifier
    command: speckit.agentic-team.role
    integration: "{{ inputs.integration }}"
    input:
      args: "agent=independent-verifier stage=implement spec={{ inputs.spec_id }}"
  - id: rework-2-data-agent
    command: speckit.agentic-team.role
    integration: "{{ inputs.integration }}"
    input:
      args: "agent=data-agent stage=implement spec={{ inputs.spec_id }}"
  - id: rework-2-contract-agent
    command: speckit.agentic-team.role
    integration: "{{ inputs.integration }}"
    input:
      args: "agent=contract-agent stage=implement spec={{ inputs.spec_id }}"
  - id: rework-2-backend-implementer
    command: speckit.agentic-team.role
    integration: "{{ inputs.integration }}"
    input:
      args: "agent=backend-implementer stage=implement spec={{ inputs.spec_id }}"
  - id: rework-2-frontend-implementer
    command: speckit.agentic-team.role
    integration: "{{ inputs.integration }}"
    input:
      args: "agent=frontend-implementer stage=implement spec={{ inputs.spec_id }}"
  - id: rework-2-ai-implementer
    command: speckit.agentic-team.role
    integration: "{{ inputs.integration }}"
    input:
      args: "agent=ai-implementer stage=implement spec={{ inputs.spec_id }}"
  - id: rework-2-security-reviewer
    command: speckit.agentic-team.role
    integration: "{{ inputs.integration }}"
    input:
      args: "agent=security-reviewer stage=implement spec={{ inputs.spec_id }}"
  - id: rework-2-independent-verifier
    command: speckit.agentic-team.role
    integration: "{{ inputs.integration }}"
    input:
      args: "agent=independent-verifier stage=implement spec={{ inputs.spec_id }}"
  - id: check
    command: speckit.agentic.check
    integration: "{{ inputs.integration }}"
  - id: g5-implementation
    type: agentic-gate
    gate: G5
    spec: "{{ inputs.spec_id }}"

  - id: verify-independent-verifier
    command: speckit.agentic-team.role
    integration: "{{ inputs.integration }}"
    input:
      args: "agent=independent-verifier stage=verify spec={{ inputs.spec_id }}"
  - id: verify-drift-sentinel
    command: speckit.agentic-team.role
    integration: "{{ inputs.integration }}"
    input:
      args: "agent=drift-sentinel stage=verify spec={{ inputs.spec_id }}"
  - id: g6-verification
    type: agentic-gate
    gate: G6
    spec: "{{ inputs.spec_id }}"

  - id: release-release-agent
    command: speckit.agentic-team.role
    integration: "{{ inputs.integration }}"
    input:
      args: "agent=release-agent stage=release spec={{ inputs.spec_id }}"
  - id: g7-release
    type: agentic-gate
    gate: G7
    spec: "{{ inputs.spec_id }}"
