# The kit on Windows. When this file was added, on 2026-11-26, nothing in the kit had run on Windows:
# this job is how that gets found out (docs/design/windows-job.md). It does not run on the default
# branch yet, so that a first failure does not turn `main` red. It runs on every other branch that is
# pushed, and by hand. When it has passed once, Windows joins the matrix in tests.yml and this file goes.
# The job can read this repository and nothing else: no secret, no write permission, no deployment.
name: windows
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: "3.12"
      - name: Install what the tests need, and Spec Kit at the pinned release
        run: python -m pip install "pyyaml==6.0.3" "pytest==9.2.0" "specify-cli==1.4.3"
      - name: What is installed
        run: |
          python --version
          git --version
          specify --version
      # Every step below runs even when an earlier one failed, so that one run shows everything. A failed step still fails the job.
      - name: Unit tests, with the newcomer's walk through install.ps1 and install.sh
        if: ${{ !cancelled() }}
        run: python -m pytest tests -q -rs
      - name: Self-test (every check passes on the sample and fails on its broken variant)
        if: ${{ !cancelled() }}
        run: python extensions/agentic/scripts/agentic.py selftest
      - name: Golden tasks (both modes, seeded defects, planted instructions)
        if: ${{ !cancelled() }}
        run: python extensions/agentic/scripts/agentic.py golden run --fixture fixtures/multi-app
      - name: Demo (one gate closes and opens again)
        if: ${{ !cancelled() }}
        run: python extensions/agentic/scripts/agentic.py demo
