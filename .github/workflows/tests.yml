# The kit's own tests, on every pull request and on every push to the default branch.
# The jobs can read this repository and nothing else: no secret, no write permission, no deployment.
# First run: 2026-11-22, on the push that added it; both Linux jobs passed. The same three commands pass
# locally on the two Python versions below, with these package versions.
# The Windows job joined on 2026-11-26. Until then it was a workflow of its own, kept off the default
# branch until it had passed once: it failed on its first run and passed on its second, both that day
# (docs/design/windows-job.md, docs/design/windows-first-run.md). It installs Spec Kit, so the install
# is walked there through install.ps1 and install.sh; the Linux jobs do not, and skip that walk.
name: tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            pytest: "9.2.0"
          - python: "3.13"
            pytest: "9.1.1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install what the tests need
        env:
          PYTEST_VERSION: ${{ matrix.pytest }}   # passed through the environment, never pasted into the command
        run: python -m pip install "pyyaml==6.0.3" "pytest==$PYTEST_VERSION"
      - name: Unit tests
        run: python -m pytest tests -q
      - name: Self-test (every check passes on the sample and fails on its broken variant)
        run: python extensions/agentic/scripts/agentic.py selftest
      - name: Golden tasks (both modes, seeded defects, planted instructions)
        run: python extensions/agentic/scripts/agentic.py golden run --fixture fixtures/multi-app
  windows:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: "3.12"
      - name: Install what the tests need, and Spec Kit at the pinned release
        run: python -m pip install "pyyaml==6.0.3" "pytest==9.2.0" "specify-cli==1.4.3"
      - name: What is installed
        run: |
          python --version
          git --version
          specify --version
      # Every step below runs even when an earlier one failed, so that one run shows everything. A failed step still fails the job.
      - name: Unit tests, with the newcomer's walk through install.ps1 and install.sh
        if: ${{ !cancelled() }}
        run: python -m pytest tests -q -rs
      - name: Self-test (every check passes on the sample and fails on its broken variant)
        if: ${{ !cancelled() }}
        run: python extensions/agentic/scripts/agentic.py selftest
      - name: Golden tasks (both modes, seeded defects, planted instructions)
        if: ${{ !cancelled() }}
        run: python extensions/agentic/scripts/agentic.py golden run --fixture fixtures/multi-app
      - name: Demo (one gate closes and opens again)
        if: ${{ !cancelled() }}
        run: python extensions/agentic/scripts/agentic.py demo
